apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-analytics
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-analytics
  template:
    metadata:
      labels:
        app: api-analytics
    spec:
      containers:
      - name: api-analytics
        image: ghcr.io/maxpopovschii/api-analytics:latest
        env:
        - name: MONGODB_HOST
          value: mongodb
        - name: MONGODB_PORT
          value: "27017"
        ports:
        - containerPort: 8086
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-analytics
  namespace: dev
spec:
  selector:
    app: api-analytics
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
  type: ClusterIP
