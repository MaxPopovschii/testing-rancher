apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notifications
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-notifications
  template:
    metadata:
      labels:
        app: api-notifications
    spec:
      containers:
      - name: api-notifications
        image: ghcr.io/maxpopovschii/api-notifications:latest
        env:
        - name: RABBITMQ_HOST
          value: rabbitmq
        - name: RABBITMQ_PORT
          value: "5672"
        ports:
        - containerPort: 8085
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-notifications
  namespace: dev
spec:
  selector:
    app: api-notifications
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
