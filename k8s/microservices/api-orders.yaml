apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orders
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-orders
  template:
    metadata:
      labels:
        app: api-orders
    spec:
      containers:
      - name: api-orders
        image: ghcr.io/maxpopovschii/api-orders:latest
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: msuser
        - name: DB_PASSWORD
          value: mspassword
        - name: DB_NAME
          value: microservices
        ports:
        - containerPort: 8083
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-orders
  namespace: dev
spec:
  selector:
    app: api-orders
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
