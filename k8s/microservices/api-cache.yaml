apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-cache
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-cache
  template:
    metadata:
      labels:
        app: api-cache
    spec:
      containers:
      - name: api-cache
        image: ghcr.io/maxpopovschii/api-cache:latest
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: api-cache
  namespace: dev
spec:
  selector:
    app: api-cache
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
