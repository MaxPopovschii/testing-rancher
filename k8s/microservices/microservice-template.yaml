# Template per microservizi
# Copia e rinomina questo file per ogni microservizio (service2, service3, ... service25)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: <service-name>
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <service-name>
  template:
    metadata:
      labels:
        app: <service-name>
    spec:
      containers:
      - name: <service-name>
        image: <docker-image>
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: microservice-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: <service-name>
  namespace: dev
spec:
  selector:
    app: <service-name>
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
