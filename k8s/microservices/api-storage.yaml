apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-storage
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-storage
  template:
    metadata:
      labels:
        app: api-storage
    spec:
      containers:
      - name: api-storage
        image: ghcr.io/maxpopovschii/api-storage:latest
        env:
        - name: MINIO_ENDPOINT
          value: http://minio:9000
        - name: MINIO_ACCESS_KEY
          value: minioadmin
        - name: MINIO_SECRET_KEY
          value: minioadmin123
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: api-storage
  namespace: dev
spec:
  selector:
    app: api-storage
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
