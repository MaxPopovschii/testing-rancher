apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-api-cache
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: redis
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-cache
    ports:
    - protocol: TCP
      port: 6379
  policyTypes:
  - Ingress
