apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-from-api-storage
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: minio
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-storage
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
  policyTypes:
  - Ingress
