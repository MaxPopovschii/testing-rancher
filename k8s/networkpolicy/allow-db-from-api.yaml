apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-apis
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-users
    - podSelector:
        matchLabels:
          app: api-orders
    - podSelector:
        matchLabels:
          app: api-products
    ports:
    - protocol: TCP
      port: 5432
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-from-analytics
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: mongodb
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-analytics
    ports:
    - protocol: TCP
      port: 27017
  policyTypes:
  - Ingress
